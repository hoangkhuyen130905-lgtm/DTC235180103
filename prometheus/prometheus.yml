global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Giám sát chính bản thân Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát Ứng dụng Web Thư viện (Node.js Metrics)
  - job_name: 'library-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:3000']

  # 3. Giám sát Container (cAdvisor - CPU, RAM, Network của từng container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Giám sát Cơ sở dữ liệu PostgreSQL (postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 5. Giám sát Web Server Nginx (nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

