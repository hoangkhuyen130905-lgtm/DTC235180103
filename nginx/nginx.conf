events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Định dạng log chuẩn JSON phục vụ thu thập log tập trung (Loki + Promtail)
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status_code":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    access_log /var/log/nginx/access_json.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream tới các dịch vụ trong mạng nội bộ Docker
    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
    }

    # ==========================================================
    # 1. Cấu hình HTTP (Cổng 80) - Tự động chuyển hướng sang HTTPS
    # ==========================================================
    server {
        listen 80;
        server_name localhost;

        # Endpoint cho Nginx Prometheus Exporter thu thập số liệu
        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Chuyển hướng toàn bộ sang HTTPS (Hardening SSL/TLS)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================
    # 2. Cấu hình HTTPS (Cổng 443) - Reverse Proxy & Security Headers
    # ==========================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ------------------------------------------------------
        # HARDENING: Security Headers chống XSS, Clickjacking, Sniffing
        # ------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Ẩn phiên bản Nginx để tránh thu thập thông tin tấn công
        server_tokens off;

        # Reverse Proxy tới Web App Thư viện
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Reverse Proxy tới công cụ quản lý pgAdmin
        location /pgadmin/ {
            proxy_pass http://pgadmin_backend/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # Endpoint giám sát trạng thái Nginx
        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}

