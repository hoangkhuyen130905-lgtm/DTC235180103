server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập Access Log và Error Log của Nginx Reverse Proxy
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            client_ip: client_ip
            method: request_method
            uri: request_uri
            status: status_code
            latency: request_time
      - labels:
          method:
          status:

  # 2. Thu thập log của ứng dụng Thư viện (Node.js Web App)
  - job_name: library-web
    static_configs:
      - targets:
          - localhost
        labels:
          job: library-web
          app: library-management
          __path__: /var/log/app/*.log

